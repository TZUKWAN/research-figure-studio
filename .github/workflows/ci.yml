name: CI

# Test gate for every PR and push: changed-file formatting, lint, typecheck across
# all workspaces, and the full unit-test suite (engine packages and app tests).
# Packaging/signing is handled
# by separate release automation — this workflow never builds installers.

on:
  push:
    branches: [main, 'dev_*', 'release_*', 'refactor_*', 'refactor/**', 'audit/**']
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    # nightly research model smoke (03:07 UTC); the smoke job no-ops elsewhere
    - cron: '7 3 * * *'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check dependency licenses
        run: npm run licenses

      - name: Check formatting
        env:
          FORMAT_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        # For PRs the checkout is the PR merge commit, so its first parent is the
        # exact main revision the merge was built against. The event's base.sha can
        # lag behind a fast-moving main, which pulls unrelated main-side files into
        # the changed-file set and fails the check on files the PR never touched.
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            FORMAT_BASE_REF=$(git rev-parse HEAD^1)
          fi
          npm run format:check

      - name: Check theme colors
        env:
          FORMAT_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            FORMAT_BASE_REF=$(git rev-parse HEAD^1)
          fi
          npm run check:theme-colors

      # Keep tracked code comments and contributor-facing documentation
      # English-only; functional CJK strings and AI prompt examples are allowed.
      - name: Check comments/docs are English-only
        run: npm run check:english-comments

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Regenerate test fixtures
        run: npm run fixtures

      # Generation is byte-deterministic (zip entry mtimes are pinned in
      # tests/helpers/build-docx.ts); a diff here means the generator and the
      # committed fixtures have drifted apart.
      - name: Check committed fixtures match the generator
        run: git diff --exit-code -- fixtures/generated

      - name: Test
        run: npm test

  # QA-P1-15: fast DETERMINISTIC research-figure gate. Runs on every push/PR
  # (including refactor/** and audit/**), needs no model and no API key: the
  # geometry & semantic regression suite, the rendered-baseline fingerprints,
  # property/fuzz + metamorphic invariants, the roundtrip contract and the
  # publication-QA gates all live in the research-harness + pptx-engine suites.
  research-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Research harness (critics, geometry, baseline, property/fuzz, metamorphic, perf)
        run: npm run test -w @genoffice/research-harness

      - name: PPTX engine (semantic metadata roundtrip)
        run: npm run test -w @genoffice/pptx-engine -- semantic-metadata

      - name: Research harness typecheck
        run: npm run typecheck -w @genoffice/research-harness

  # Optional MODEL smoke (structured planner + Vision Critic against a real
  # model). Never runs on push/PR — an external API key must never gate normal
  # CI. Requires repository secrets; skips cleanly when they are absent.
  research-model-smoke:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Model smoke (skipped without secrets)
        env:
          METIS_SMOKE_BASE_URL: ${{ secrets.METIS_SMOKE_BASE_URL }}
          METIS_SMOKE_API_KEY: ${{ secrets.METIS_SMOKE_API_KEY }}
          METIS_SMOKE_MODEL: ${{ secrets.METIS_SMOKE_MODEL }}
        run: |
          if [ -z "$METIS_SMOKE_BASE_URL" ] || [ -z "$METIS_SMOKE_API_KEY" ]; then
            echo "METIS_SMOKE_* secrets not configured — model smoke skipped (not a failure)"
            exit 0
          fi
          node scripts/research-model-smoke.mjs

  e2e:
    # 22.04, not -latest: 24.04's AppArmor hardening blocks Electron renderer
    # spawn under xvfb even with --no-sandbox and the userns sysctl lifted
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build apps
        run: npm run build:all

      # Newer Ubuntu kernels ship an AppArmor policy that blocks unprivileged
      # user namespaces, which kills the Chromium zygote even with --no-sandbox
      # (window opens, renderer never loads). The knob only exists on kernels
      # that enforce the restriction, so skip it where it is absent instead of
      # failing the job (22.04 runner images vary by kernel).
      - name: Allow unprivileged user namespaces (Electron)
        run: |
          if sysctl kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          else
            echo "kernel.apparmor_restrict_unprivileged_userns not present — skipping"
          fi

      # Electron needs a display server on Linux runners. DEBUG=pw:browser
      # forwards the Electron process stdout/stderr into the CI log so launch
      # failures are diagnosable.
      - name: E2E (Electron shell)
        env:
          DEBUG: 'pw:browser'
        run: xvfb-run --auto-servernum -- npm run test:e2e

      - name: Upload E2E artifacts on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-artifacts
          path: |
            e2e/artifacts
            e2e/test-results
          retention-days: 7
